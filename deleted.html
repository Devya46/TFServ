<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thakkar Financial Services · Wealth Planning</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #ffffff;
        font-family:
          "Poppins",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
      }

      .hero-wrapper {
        width: 100%;
        max-width: 100%;
        margin: 0 auto;
        padding: 0;
        overflow: hidden;
      }

      /* ========================================
         HERO SECTION
      ======================================== */

      .hero-section {
        position: relative;
        min-height: 660px;
        padding: 140px 30px 0;
        overflow: hidden;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;

        text-align: center;
        color: #ffffff;

        background:
          radial-gradient(
            circle at 50% 0%,
            rgba(78, 224, 213, 0.25),
            transparent 24%
          ),
          radial-gradient(
            circle at 10% 70%,
            rgba(0, 195, 180, 0.12),
            transparent 28%
          ),
          linear-gradient(135deg, #031728 0%, #061c2d 48%, #021421 100%);
      }
      /* Background image */
      .hero-section {
        background-blend-mode: overlay; /* Blends image with gradients */
        background-size: cover;
        background-position: center;
        background-image:
          url("https://thakkarfinancialservice.com/wp-content/uploads/2026/09/bbbggg11.png"),
          radial-gradient(
            circle at 50% 0%,
            rgba(78, 224, 213, 0.25),
            transparent 24%
          ),
          radial-gradient(
            circle at 10% 70%,
            rgba(0, 195, 180, 0.12),
            transparent 28%
          ),
          linear-gradient(135deg, #031728 0%, #061c2d 48%, #021421 100%);
      }

      /* Atmospheric glow */

      .hero-section::before {
        content: "";
        position: absolute;

        width: 520px;
        height: 520px;

        top: -300px;
        left: 50%;

        transform: translateX(-50%);

        border-radius: 50%;

        background: rgba(64, 224, 208, 0.2);

        filter: blur(80px);

        pointer-events: none;
      }

      /* Subtle grain / star texture */

      .hero-section::after {
        content: "";

        position: absolute;
        inset: 0;

        opacity: 0.28;

        pointer-events: none;

        background-image: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.42) 0.8px,
          transparent 0.9px
        );

        background-size: 58px 58px;

        mask-image: linear-gradient(to bottom, black, transparent 72%);
      }

      .hero-content {
        position: relative;
        z-index: 2;

        animation: heroContentFade 0.8s ease both;
      }

      /* ========================================
         TAG
      ======================================== */

      .hero-tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        padding: 8px 18px;
        margin-bottom: 22px;

        border: 1px solid rgba(91, 235, 218, 0.28);
        border-radius: 999px;

        background: rgba(255, 255, 255, 0.055);

        color: #9deee1;

        font-size: 12px;
        font-weight: 500;

        letter-spacing: 0.06em;

        backdrop-filter: blur(10px);

        text-transform: uppercase;
      }

      /* ========================================
         HERO TITLE
         Barlow Condensed + BACK TO FRONT ANIMATION
      ======================================== */

      .hero-title {
        max-width: 1000px;
        margin: 0 auto;
        color: #ffffff;
        font-family: "Barlow Condensed", sans-serif;
        font-size: clamp(52px, 7vw, 88px);
        line-height: 0.98;
        font-weight: 500;
        letter-spacing: -0.025em;
        text-wrap: balance;
        transform-origin: center center;
        animation: heroTitleBackToFront 1.25s cubic-bezier(0.16, 1, 0.3, 1) both;
        will-change: transform, opacity, filter;
      }

      .hero-title strong {
        font-family: "Barlow Condensed", sans-serif;

        font-weight: 600;

        background: linear-gradient(
          90deg,
          #1ee7d2 0%,
          #8cf0c5 48%,
          #ffffff 100%
        );

        -webkit-background-clip: text;
        background-clip: text;

        color: transparent;
      }

      /* ========================================
         BACK → FRONT TITLE ANIMATION
      ======================================== */

      @keyframes heroTitleBackToFront {
        0% {
          opacity: 0;

          transform: perspective(900px) translateZ(-700px) scale(0.35);

          filter: blur(24px);
        }

        30% {
          opacity: 0.7;

          transform: perspective(900px) translateZ(-200px) scale(0.75);

          filter: blur(8px);
        }

        65% {
          opacity: 0.95;

          transform: perspective(900px) translateZ(30px) scale(1.05);

          filter: blur(1px);
        }

        100% {
          opacity: 1;

          transform: perspective(900px) translateZ(0) scale(1);

          filter: blur(0);
        }
      }

      /* ========================================
         HERO DESCRIPTION
      ======================================== */

      .hero-desc {
        max-width: 680px;

        margin: 28px auto 0;

        color: rgba(232, 242, 247, 0.74);

        font-family: "Poppins", sans-serif;

        font-size: 15px;

        line-height: 1.8;

        font-weight: 400;

        letter-spacing: 0.005em;

        text-wrap: balance;

        animation: heroDescFade 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
      }

      .hero-desc strong {
        color: #b9f4e8;

        font-weight: 600;
      }

      /* Description animation */

      @keyframes heroDescFade {
        from {
          opacity: 0;
          transform: translateY(18px);
          filter: blur(5px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }

      /* ========================================
         BUTTONS
      ======================================== */

      .hero-buttons {
        display: flex;

        align-items: center;
        justify-content: center;

        gap: 14px;

        margin-top: 30px;

        flex-wrap: wrap;

        animation: heroButtonsFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both;
      }

      .hero-buttons a {
        text-decoration: none;
      }

      .hero-btn {
        min-width: 150px;
        min-height: 48px;

        padding: 12px 22px;

        border-radius: 60px;

        cursor: pointer;

        font-size: 14px;
        font-weight: 600;

        transition: all 0.25s ease;

        display: inline-flex;

        align-items: center;
        justify-content: center;

        gap: 10px;

        border: none;

        font-family: "Poppins", sans-serif;
      }

      .hero-btn-primary {
        background: #16e4cf;

        color: #03201f;

        box-shadow: 0 12px 30px rgba(18, 224, 201, 0.25);

        border: 1px solid #19e6ce;
      }

      .hero-btn-primary::after {
        content: "→";

        width: 26px;
        height: 26px;

        display: inline-flex;

        align-items: center;
        justify-content: center;

        border-radius: 50%;

        background: rgba(0, 35, 34, 0.16);

        font-size: 16px;

        transition: 0.2s;

        font-weight: 400;
      }

      .hero-btn-secondary {
        background: rgba(255, 255, 255, 0.04);

        border: 1px solid rgba(78, 205, 197, 0.3);

        color: #d9f8f3;

        backdrop-filter: blur(8px);
      }

      .hero-btn-secondary::after {
        content: "↗";

        width: 26px;
        height: 26px;

        display: inline-flex;

        align-items: center;
        justify-content: center;

        border-radius: 50%;

        background: rgba(60, 218, 204, 0.08);

        color: #7ce9dd;

        font-size: 14px;

        transition: 0.2s;
      }

      .hero-btn:hover {
        transform: translateY(-3px);
      }

      .hero-btn-primary:hover {
        box-shadow: 0 18px 40px rgba(18, 224, 201, 0.35);

        background: #1cefd9;
      }

      .hero-btn-secondary:hover {
        border-color: rgba(78, 205, 197, 0.65);

        background: rgba(78, 205, 197, 0.08);
      }

      /* ========================================
         CONTENT FADE
      ======================================== */

      @keyframes heroContentFade {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      @keyframes heroButtonsFade {
        from {
          opacity: 0;
          transform: translateY(14px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ========================================
         REDUCED MOTION
      ======================================== */

      @media (prefers-reduced-motion: reduce) {
        .hero-content,
        .hero-title,
        .hero-desc,
        .hero-buttons {
          animation: none;
        }
      }

      /* ========================================
         TABLET
      ======================================== */

      @media (max-width: 900px) {
        .hero-section {
          min-height: 760px;

          padding: 65px 24px 0;
        }

        .hero-title {
          max-width: 760px;

          font-size: clamp(50px, 8vw, 70px);
        }

        .hero-desc {
          max-width: 650px;
        }
      }

      /* ========================================
         MOBILE
      ======================================== */

      @media (max-width: 600px) {
        .hero-section {
          min-height: auto;

          padding: 54px 18px 70px;
        }

        .hero-tag {
          font-size: 10px;

          padding: 6px 14px;

          margin-bottom: 18px;
        }

        .hero-title {
          max-width: 100%;

          font-size: 48px;

          line-height: 0.98;

          letter-spacing: -0.02em;
        }

        .hero-desc {
          max-width: 340px;

          margin-top: 22px;

          font-size: 13px;

          line-height: 1.7;
        }

        .hero-buttons {
          width: 100%;

          flex-direction: column;

          margin-top: 25px;
        }

        .hero-btn {
          width: 100%;

          max-width: 300px;
        }
      }

      /* ========================================
         SMALL MOBILE
      ======================================== */

      @media (max-width: 380px) {
        .hero-title {
          font-size: 43px;
        }

        .hero-desc {
          font-size: 12.5px;
        }
      }
    </style>
  </head>

  <body>
    <div class="hero-wrapper">
      <section class="hero-section">
        <div class="hero-content">
          <div class="hero-tag">TRUSTED FINANCIAL PARTNER</div>

          <div class="hero-title">
            Guiding You Towards
            <strong>Financial Freedom</strong>
          </div>

          <div class="hero-desc">
            Helping individuals, professionals, entrepreneurs, and families make
            smarter financial decisions through
            <strong>personalized advice, disciplined investing,</strong>
            and long-term wealth planning.
          </div>

          <div class="hero-buttons">
            <a href="https://financewithajay.co/contact/">
              <button class="hero-btn hero-btn-primary">Get in Touch</button>
            </a>

            <a href="#SFA">
              <button class="hero-btn hero-btn-secondary">
                Explore Services
              </button>
            </a>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
